---
# Example inventory for the Kubernetes role: one control-plane node and
# two workers, matching the default k8s_control_plane_group/k8s_workers_group
# variable names ("masters"/"workers").

all:
  children:
    masters:
      hosts:
        master-01:
          ansible_host: 10.0.0.10
    workers:
      hosts:
        worker-01:
          ansible_host: 10.0.0.11
        worker-02:
          ansible_host: 10.0.0.12
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/ansible_key
